name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Validate marketplace manifest
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          ~/.local/bin/claude plugin validate .claude-plugin/marketplace.json

      - name: Lint install.py
        run: |
          uvx ruff check
          uvx ruff format --check

      - name: Test install.py
        run: uv run --no-project --python 3.9 --with pytest pytest -q
